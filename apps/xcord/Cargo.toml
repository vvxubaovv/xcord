[package]
name = "xcord"
version.workspace = true
edition.workspace = true

[dependencies]
gpui = "0.2.2"
raw-window-handle = "0.6"
xcord-cordis = { path = "../../crates/cordis" }
xcord-plugin-api = { path = "../../crates/plugin-api" }
xcord-builtins = { path = "../../crates/plugins" }
xcord-store = { path = "../../crates/store" }
xcord-vt = { path = "../../crates/vt" }
async-channel = "2"
env_logger = "0.11"
log.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9"
encoding_rs = "0.8"
sha2 = "0.10"
tokio.workspace = true
unicode-segmentation = "1"
base64 = "0.22"

[build-dependencies]
winresource = "0.1"
